name: Deploy predictor to GitHub Pages

# Publishes docs/ to the gh-pages branch, which GitHub Pages serves.
# This avoids the Pages REST API, which the default GITHUB_TOKEN cannot
# use to create the site.

on:
  push:
    branches: [main, "claude/friendly-einstein-ff5zwv"]
    paths: ["docs/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          git checkout --orphan publish
          git rm -rf -q .
          git checkout ${{ github.sha }} -- docs
          mv docs/* .
          rmdir docs
          touch .nojekyll
          git add -A
          git commit -m "Deploy site from ${{ github.sha }}"
          git push origin publish:gh-pages --force
